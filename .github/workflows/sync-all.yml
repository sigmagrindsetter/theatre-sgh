name: Sync All

on:
  schedule:
    # Hourly 9:00-23:00 CET + 4:00 CET (UTC+1 → UTC 3,8-22)
    - cron: '0 3,8-22 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore sync cache
        uses: actions/cache@v4
        with:
          path: .last_sync
          key: sync-state-${{ github.run_id }}
          restore-keys: sync-state-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system fonts
        run: sudo apt-get install -y --no-install-recommends fonts-liberation

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all syncs
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_PRIVATE_KEY_ID: ${{ secrets.GOOGLE_PRIVATE_KEY_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python sync_all.py
