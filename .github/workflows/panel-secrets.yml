name: Panel secrets

# Copies the panel's GitHub secrets into Secret Manager (apps/recruitment/REVIEW_PANEL_SPEC.md §6.3).
# Older versions are destroyed, not disabled: Secret Manager bills disabled versions as active
# ones (6 free per billing account), destroyed ones are free. Cloud Run reads :latest when an
# instance starts, so a running instance keeps the old values until it is replaced.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  secrets:
    runs-on: ubuntu-latest
    concurrency:
      group: panel-secrets
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: theatre-sgh
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Add new versions, destroy older ones
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_OAUTH_CLIENT_ID: ${{ secrets.NOTION_OAUTH_CLIENT_ID }}
          NOTION_OAUTH_CLIENT_SECRET: ${{ secrets.NOTION_OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          names=(NOTION_API_TOKEN NOTION_OAUTH_CLIENT_ID NOTION_OAUTH_CLIENT_SECRET SESSION_SECRET INGEST_TOKEN)
          missing=0
          for name in "${names[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret $name is empty or missing"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          for name in "${names[@]}"; do
            new="$(printf '%s' "${!name}" | gcloud secrets versions add "$name" --data-file=- --format='value(name.basename())')"
            if [ -z "$new" ]; then
              echo "::error::Could not read the new version number of $name; older versions kept"
              exit 1
            fi
            older="$(gcloud secrets versions list "$name" --filter='state!=DESTROYED' --format='value(name.basename())')"
            for version in $older; do
              if [ "$version" != "$new" ]; then
                gcloud secrets versions destroy "$version" --secret="$name" --quiet
              fi
            done
            echo "$name: version $new is the only one left"
          done
